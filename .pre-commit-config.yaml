ci:
  autofix_pr: true
  autofix_commit_msg: |
    style(pre-commit): auto fixes from pre-set hooks

repos:
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        name: Blacken files

  - repo: https://github.com/pycqa/isort
    rev: 9.0.1
    hooks:
      - id: isort
        args: ["--profile", "black"]
        name: Running isort in all files.
